<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1117">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CA Hours Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit;cursor:pointer;}
  button:active{opacity:.7;transform:scale(.97);}

  /* ── DARK MODE (default) ── */
  body{
    background:#0F1117;color:#E8EAF0;
    font-family:'DM Sans','Segoe UI',sans-serif;
    max-width:480px;margin:0 auto;padding-bottom:80px;min-height:100vh;
    transition:background .3s,color .3s;
  }
  #header{background:linear-gradient(135deg,#1A1D28,#161924);padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:50;transition:background .3s,border-color .3s;}
  #header-label{font-size:10px;letter-spacing:2px;color:#666;text-transform:uppercase;font-weight:700;}
  #header-title{font-size:19px;font-weight:800;letter-spacing:-.5px;}
  #header-remaining{font-size:26px;font-weight:800;color:#fff;letter-spacing:-1px;}
  #header-sub{font-size:10px;color:#888;}
  #global-bar-wrap{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
  #global-bar{height:100%;background:linear-gradient(90deg,#7EC8A8,#E8A87C);border-radius:3px;transition:width .5s ease;}
  #header-pct{font-size:10px;color:#555;margin-top:4px;}
  #tabs{display:flex;background:#161924;border-bottom:1px solid rgba(255,255,255,.06);padding:0 10px;overflow-x:auto;transition:background .3s;}
  .tab-btn{background:none;border:none;padding:11px 13px 9px;font-size:12px;font-weight:600;color:#555;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .2s;}
  .tab-btn.active{border-bottom-color:var(--col);}
  .card{background:#1A1D28;border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);transition:background .3s,border-color .3s;}
  .card.done{background:rgba(126,200,168,.05);border-color:rgba(126,200,168,.18);}
  .bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:6px;}
  .chapter-card{background:#1A1D28;border-radius:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06);overflow:hidden;transition:background .3s,border-color .3s;}
  .chapter-card.done{background:rgba(126,200,168,.05);border-color:rgba(126,200,168,.18);}
  .chapter-body{border-top:1px solid rgba(255,255,255,.06);padding:10px 14px 14px;display:none;}
  .chapter-arrow{color:#444;font-size:16px;margin-left:auto;transition:transform .2s,color .3s;}
  .ch-time{font-size:10px;color:#666;margin-top:2px;}
  .lec-row{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);}
  #stats-strip{display:flex;gap:0;background:#161924;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;transition:background .3s;}
  .stat-pill{flex:1;min-width:90px;padding:8px 10px;text-align:center;border-right:1px solid rgba(255,255,255,.05);}
  .stat-pill:last-child{border-right:none;}
  .stat-val{font-size:13px;font-weight:800;letter-spacing:-.5px;color:#fff;white-space:nowrap;transition:color .3s;}
  .stat-lbl{font-size:9px;color:#555;margin-top:1px;text-transform:uppercase;letter-spacing:.5px;}
  .day-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
  .day-label{font-size:12px;font-weight:700;min-width:82px;color:#ccc;}
  .day-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
  .lec-date{font-size:9px;color:#555;margin-top:1px;}

  /* ── LIGHT MODE ── */
  body.light{background:#F0EEE9;color:#1E1B16;}
  body.light #header{background:linear-gradient(135deg,#E8E2D9,#EDE8E0);border-bottom:1px solid rgba(0,0,0,.07);}
  body.light #header-label{color:#A09880;}
  body.light #header-remaining{color:#1E1B16;}
  body.light #header-sub{color:#9A8F80;}
  body.light #global-bar-wrap{background:rgba(0,0,0,.08);}
  body.light #header-pct{color:#B0A898;}
  body.light #tabs{background:#EAE5DC;border-bottom:1px solid rgba(0,0,0,.07);}
  body.light .tab-btn{color:#B0A898;}
  body.light #stats-strip{background:#EAE5DC;border-bottom:1px solid rgba(0,0,0,.07);}
  body.light .stat-pill{border-right:1px solid rgba(0,0,0,.07);}
  body.light .stat-val{color:#1E1B16;}
  body.light .stat-lbl{color:#A09880;}
  body.light .card{background:#F7F4EF;border:1px solid rgba(0,0,0,.07);}
  body.light .card.done{background:rgba(62,160,100,.06);border-color:rgba(62,160,100,.2);}
  body.light .chapter-card{background:#F7F4EF;border:1px solid rgba(0,0,0,.07);}
  body.light .chapter-card.done{background:rgba(62,160,100,.06);border-color:rgba(62,160,100,.2);}
  body.light .chapter-body{border-top:1px solid rgba(0,0,0,.06);}
  body.light .chapter-arrow{color:#C0B8AA;}
  body.light .bar-wrap{background:rgba(0,0,0,.07);}
  body.light .lec-row{border-bottom:1px solid rgba(0,0,0,.05);}
  body.light .day-row{border-bottom:1px solid rgba(0,0,0,.05);}
  body.light .day-label{color:#4A3F30;}
  body.light .day-bar-wrap{background:rgba(0,0,0,.07);}
  body.light .lec-date{color:#B0A898;}
  body.light .ch-time{color:#A09880;}

  /* ── SHARED STATIC STYLES ── */
  #header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  #header-right{text-align:right;}
  .page{padding:16px;display:none;}
  .page.visible{display:block;}
  .card-row{display:flex;align-items:center;gap:12px;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;}
  .ring-wrap{position:relative;flex-shrink:0;}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:inherit;}
  .chapter-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;}
  .chapter-body.open{display:block;}
  .chapter-arrow.open{transform:rotate(90deg);}
  .ch-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;display:inline-block;margin-bottom:3px;}
  .ch-name{font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lec-row:last-child{border-bottom:none;}
  .lec-check{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .15s;}
  .lec-name{flex:1;font-size:12px;}
  .lec-dur{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;}
  .btn-row{display:flex;justify-content:space-between;margin-bottom:10px;}
  .btn-sm{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;border:none;}
  #countdown-wrap{font-variant-numeric:tabular-nums;}
  #daily-panel{padding:16px;}
  .day-row:last-child{border-bottom:none;}
  .day-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7EC8A8,#7EB8C8);transition:width .4s ease;}
  .day-hrs{font-size:11px;font-weight:700;color:#7EC8A8;min-width:36px;text-align:right;}

  /* ── THEME TOGGLE BUTTON ── */
  #theme-toggle{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:4px 10px;
    font-size:12px;
    color:#aaa;
    display:flex;align-items:center;gap:5px;
    transition:all .25s;
    white-space:nowrap;
    margin-top:2px;
  }
  body.light #theme-toggle{
    background:rgba(0,0,0,.07);
    border-color:rgba(0,0,0,.12);
    color:#7A6F60;
  }
</style>

const STORAGE_KEY = "hours_tracker_html_v1";
const TIMESTAMPS_KEY = "hours_tracker_timestamps_v1";

// --- State ---
let watched = {};
let timestamps = {}; // lecId -> ISO date string when ticked

function initState() {
  SUBJECTS.forEach(s => s.chapters.forEach(ch => ch.lectures.forEach(l => { watched[l.id] = l.done; })));
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) watched = JSON.parse(s); } catch{}
  try { const t = localStorage.getItem(TIMESTAMPS_KEY); if(t) timestamps = JSON.parse(t); } catch{}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(watched)); } catch{}
  try { localStorage.setItem(TIMESTAMPS_KEY, JSON.stringify(timestamps)); } catch{}
}

// --- Utils ---
function fmtMins(m) {
  const h = Math.floor(m/60), mm = Math.round(m%60);
  if(h===0) return mm+'m';
  if(mm===0) return h+'h';
  return h+'h '+mm+'m';
}
function chStats(ch) {
  const total = ch.lectures.reduce((s,l)=>s+l.mins,0);
  const done  = ch.lectures.filter(l=>watched[l.id]).reduce((s,l)=>s+l.mins,0);
  return {total,done,remaining:total-done,pct:total?Math.round(done/total*100):0,allDone:done>=total};
}
function subStats(sub) {
  const total = sub.chapters.reduce((s,ch)=>s+ch.lectures.reduce((x,l)=>x+l.mins,0),0);
  const done  = sub.chapters.reduce((s,ch)=>s+ch.lectures.filter(l=>watched[l.id]).reduce((x,l)=>x+l.mins,0),0);
  return {total,done,remaining:total-done,pct:total?Math.round(done/total*100):0};
}
function globalStats() {
  let total=0,done=0;
  SUBJECTS.forEach(s=>{ const ss=subStats(s); total+=ss.total; done+=ss.done; });
  return {total,done,remaining:total-done,pct:total?Math.round(done/total*100):0};
}

// --- Feature 1: Chapter counter ---
function chapterStats() {
  let total=0, done=0;
  SUBJECTS.forEach(s => s.chapters.forEach(ch => {
    total++;
    const cs = chStats(ch);
    if(cs.allDone) done++;
  }));
  return {total, done};
}

// --- Feature 2 & 3: Days left + countdown ---
const HOURS_PER_DAY = 6;
function daysLeft(remainingMins) {
  const remainingHours = remainingMins / 60;
  return Math.ceil(remainingHours / HOURS_PER_DAY);
}
// Time until remaining hours crosses the next whole "day" boundary
// i.e. how much more do I need to watch before days drops by 1
function timeToNextDayDrop(remainingMins) {
  const remainingHours = remainingMins / 60;
  const currentDays = Math.ceil(remainingHours / HOURS_PER_DAY);
  // next lower day threshold: (currentDays - 1) * 6 hours
  const nextThresholdHours = (currentDays - 1) * HOURS_PER_DAY;
  const minsToGo = (remainingHours - nextThresholdHours) * 60;
  return minsToGo; // in minutes
}
function fmtCountdown(mins) {
  if(mins <= 0) return '0:00:00';
  const totalSec = Math.round(mins * 60);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// --- Feature 4: Daily hours tracker ---
function getDailyLog() {
  const log = {}; // "YYYY-MM-DD" -> total mins
  SUBJECTS.forEach(s => s.chapters.forEach(ch => ch.lectures.forEach(lec => {
    if(watched[lec.id] && timestamps[lec.id]) {
      const d = timestamps[lec.id].slice(0,10);
      log[d] = (log[d] || 0) + lec.mins;
    }
  })));
  return log;
}
function renderDailyTracker() {
  const log = getDailyLog();
  const days = Object.keys(log).sort().reverse();
  if(days.length === 0) return `<div style="text-align:center;color:#444;font-size:12px;padding:30px 0">No sessions recorded yet.<br><span style="font-size:10px">Tick a lecture to start tracking.</span></div>`;
  const maxMins = Math.max(...Object.values(log));
  const hoursGoal = HOURS_PER_DAY * 60;
  return days.map(d => {
    const mins = log[d];
    const hrs = (mins/60).toFixed(1);
    const pct = Math.min(100, Math.round(mins/hoursGoal*100));
    const barColor = mins >= hoursGoal ? '#7EC8A8' : mins >= hoursGoal*0.5 ? '#E8A87C' : '#7EB8C8';
    const dateObj = new Date(d + 'T00:00:00');
    const label = dateObj.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="day-row">
      <div class="day-label">${label}</div>
      <div class="day-bar-wrap"><div class="day-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="day-hrs" style="color:${barColor}">${hrs}h</div>
    </div>`;
  }).join('');
}

// --- SVG Ring ---
function makeSVGRing(pct, size, sw, color, labelSize) {
  const r = (size - sw*2)/2;
  const circ = 2*Math.PI*r;
  const offset = circ*(1-pct/100);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg);position:absolute;">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
        style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div class="ring-label" style="color:${color};font-size:${labelSize||11}px;">${Math.round(pct)}%</div>
  </div>`;
}

  const g = globalStats();

  document.getElementById('global-bar').style.width = g.pct+'%';
  document.getElementById('header-pct').textContent = `${g.pct}% watched · ${fmtMins(g.done)} done`;

  // Feature 1: chapter counter
  const ch = chapterStats();
  document.getElementById('stat-chapters').textContent = `${ch.done}/${ch.total}`;

  // Feature 2: days left
  const days = daysLeft(g.remaining);
  document.getElementById('stat-days').textContent = days > 0 ? `${days}d` : '🎉 Done';

  // Feature 3: countdown to next day drop
  const mins = timeToNextDayDrop(g.remaining);
  document.getElementById('stat-countdown').textContent = fmtCountdown(mins) + ' to go';

  // Feature 5: syllabus completion date
  const compEl = document.getElementById('stat-completion');
  if(days <= 0) {
    compEl.textContent = '🎉 Done!';
  } else {
    const today = new Date();
    today.setHours(0,0,0,0);
    const completionDate = new Date(today);
    completionDate.setDate(today.getDate() + days);
    const opts = {day:'numeric',month:'short'};
    const dateStr = completionDate.toLocaleDateString('en-IN', opts);
    compEl.textContent = dateStr;
  }
}

// --- Actions ---
window.switchTab = function(id) {
  currentTab = (id === 'overview' || id === 'daily') ? id : id;
  expandedChapter = null;
  render();
  window.scrollTo(0,0);
};

window.toggleChapter = function(chId) {
  expandedChapter = expandedChapter===chId ? null : chId;
  const sub = SUBJECTS.find(s=>s.chapters.some(c=>c.id===chId));
  const pages = document.getElementById('pages');
  pages.innerHTML = `<div class="page visible">${renderSubject(sub)}</div>`;
};

window.toggleLec = function(subId, chId, lecId) {
  const nowTicking = !watched[lecId];
  watched[lecId] = nowTicking;
  if(nowTicking) {
    timestamps[lecId] = new Date().toISOString();
  } else {
    delete timestamps[lecId];
  }
  save();
  const sub = SUBJECTS.find(s=>s.id===subId);
  const pages = document.getElementById('pages');
  pages.innerHTML = `<div class="page visible">${renderSubject(sub)}</div>`;
  renderHeader();
};

window.markAll = function(subId, chId, val) {
  const sub = SUBJECTS.find(s=>s.id===subId);
  const ch = sub.chapters.find(c=>c.id===chId);
  const now = new Date().toISOString();
  ch.lectures.forEach(l=>{
    watched[l.id]=val;
    if(val) { if(!timestamps[l.id]) timestamps[l.id]=now; }
    else { delete timestamps[l.id]; }
  });
  save();
  const pages = document.getElementById('pages');
  pages.innerHTML = `<div class="page visible">${renderSubject(sub)}</div>`;
  renderHeader();
};
// --- Swipe Navigation ---
let touchstartX = 0;
let touchendX = 0;
const swipeThreshold = 50; 

document.addEventListener('touchstart', e => {
  touchstartX = e.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener('touchend', e => {
  touchendX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const distance = touchendX - touchstartX;
  
  // Rebuild the exact order of your tabs
  const tabOrder = ['overview', ...SUBJECTS.map(s => s.id), 'daily'];
  const currentIndex = tabOrder.indexOf(currentTab);

  // Swiped Left (Finger moved left) -> Next Tab
  if (distance < -swipeThreshold) {
    if (currentIndex < tabOrder.length - 1) {
      switchTab(tabOrder[currentIndex + 1]);
    }
  } 
  // Swiped Right (Finger moved right) -> Previous Tab
  else if (distance > swipeThreshold) {
    if (currentIndex > 0) {
      switchTab(tabOrder[currentIndex - 1]);
    }
  }
}

// --- Theme toggle ---
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  const btn = document.getElementById('theme-toggle');
  btn.textContent = isLight ? '🌙 Dark' : '☀️ Light';
  try { localStorage.setItem('ca_theme', isLight ? 'light' : 'dark'); } catch{}
}
function initTheme() {
  try {
    const saved = localStorage.getItem('ca_theme');
    if(saved === 'light') {
      document.body.classList.add('light');
      const btn = document.getElementById('theme-toggle');
      if(btn) btn.textContent = '🌙 Dark';
    }
  } catch{}
}

// --- Boot ---
